# Nidrew server-wide Nix settings, installed as /etc/nix/nidrew.conf by
# scripts/server/apply-nix-config.sh and included once from /etc/nix/nix.conf.
# Edits on the server are preserved and reported; change this template instead.
experimental-features = nix-command flakes
sandbox = true
require-sigs = true
accept-flake-config = false
# Legacy <nixpkgs> lookups follow the system registry, pinned to flake.lock.
nix-path = nixpkgs=flake:nixpkgs
substituters = https://cache.nixos.org/
trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
